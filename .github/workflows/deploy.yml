name: Deploy ai-portfolio to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate portfolio.json (best effort, falls back to committed file)
        run: |
          if [ -f sync.py ]; then python3 sync.py || echo "sync.py needs local data, using committed portfolio.json"; fi

      - name: Build artifact
        run: |
          mkdir -p _site
          cp index.html style.css app.js portfolio.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
